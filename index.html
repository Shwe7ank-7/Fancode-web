<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fancode - @Shwe7ank</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
body {
  background: #0a0f1c;
  font-family: system-ui;
  color: white;
  padding-bottom: 60px;
}

.match-tile {
  background: #131d2f;
  border-radius: 28px;
  border: 1px solid #253247;
  overflow: hidden;
  transition: .3s;
  display: flex;
  flex-direction: column;
}

.match-tile:hover {
  transform: translateY(-6px);
  border-color: #3b82f6;
  box-shadow: 0 10px 25px -5px rgba(59,130,246,.2);
}

.img-wrapper {
  height: 200px;
  overflow: hidden;
  position: relative;
  background: #1e293b;
}

.match-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.live-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  background: #dc2626;
  font-size: 11px;
  font-weight: 800;
  padding: 4px 12px;
  border-radius: 30px;
  letter-spacing: .5px;
}

/* Language tabs overlaid on image */
.lang-tabs {
  position: absolute;
  top: 12px;
  right: 10px;
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.lang-tab {
  background: rgba(0,0,0,.72);
  border: 1px solid rgba(255,255,255,.18);
  color: #cbd5e1;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 20px;
  cursor: pointer;
  transition: .2s;
  backdrop-filter: blur(6px);
  user-select: none;
}

.lang-tab.active {
  background: #2563eb;
  border-color: #2563eb;
  color: white;
}

.score-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 4px 0;
}

.team-flag {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  object-fit: cover;
}

.score-num {
  font-size: 22px;
  font-weight: 900;
  color: white;
}

.score-sep {
  font-size: 18px;
  font-weight: 700;
  color: #475569;
}

/* Watch buttons */
.btn-india {
  background: #2563eb;
  padding: 13px 16px;
  border-radius: 14px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: .2s;
  font-size: 14px;
  border: none;
  color: white;
  width: 100%;
}

.btn-india:hover { background: #1d4ed8; }

.btn-world {
  background: transparent;
  border: 1px solid #334155;
  padding: 13px 16px;
  border-radius: 14px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: .2s;
  font-size: 14px;
  color: #94a3b8;
  width: 100%;
}

.btn-world:hover {
  border-color: #3b82f6;
  color: white;
}

.btn-notlive {
  background: #1e293b;
  padding: 13px;
  border-radius: 14px;
  text-align: center;
  font-weight: 700;
  color: #475569;
  cursor: not-allowed;
  font-size: 14px;
  width: 100%;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.88);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal-box {
  background: #131d2f;
  width: 92%;
  max-width: 360px;
  padding: 28px 24px 20px;
  border-radius: 28px;
  border: 1px solid #253247;
}

.modal-head {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 4px;
}

.modal-sub {
  font-size: 12px;
  color: #64748b;
  margin-bottom: 20px;
  line-height: 1.5;
}

.cdn-btn {
  background: #1a2640;
  border: 1px solid #253247;
  width: 100%;
  padding: 14px 16px;
  margin-bottom: 10px;
  border-radius: 14px;
  font-weight: 600;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: .2s;
  color: white;
  font-size: 14px;
}

.cdn-btn:hover {
  border-color: #3b82f6;
  background: #1e3258;
}

.cdn-tag {
  font-size: 10px;
  padding: 3px 9px;
  border-radius: 10px;
  font-weight: 800;
  letter-spacing: .4px;
}

.tag-green { background: #14532d; color: #4ade80; }
.tag-blue  { background: #1e3a5f; color: #60a5fa; }
.tag-amber { background: #451a03; color: #fb923c; }

.close-btn {
  margin-top: 14px;
  color: #ef4444;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  font-size: 14px;
  letter-spacing: .5px;
}

.close-btn:hover { color: #f87171; }

/* empty state */
.no-cdn {
  color: #64748b;
  font-size: 13px;
  text-align: center;
  padding: 16px 0;
}
</style>
<script src="https://semicolondriverelevated.com/1d/6a/57/1d6a575d756ceeb65888fb8b7328a1e6.js"></script>
</head>

<body class="p-5 max-w-7xl mx-auto">

<!-- Header -->
<div class="text-center mb-10 mt-5">
  <div class="inline-flex items-center gap-3 bg-[#131d2f] py-4 px-8 rounded-full border border-blue-900/50">
    <i class="fas fa-bolt text-yellow-400"></i>
    <span class="text-2xl font-black">FANCODE</span>
  </div>
  <p class="text-gray-500 text-xs mt-3">WEB BY @Shwe7ank</p>
</div>

<!-- Cards grid -->
<div id="matches-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>

<!-- CDN Modal -->
<div id="quality-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-head" id="modal-title">Select Server</div>
    <div class="modal-sub" id="modal-sub"></div>
    <div id="cdn-list"></div>
    <div class="close-btn" onclick="closeModal()">✕ &nbsp;CLOSE</div>
  </div>
</div>

<script>
const DATA_URL = "https://famcodexwebs.xojiv79335.workers.dev/";

/* Language display labels */
const LANG_MAP = {
  ENGLISH: 'English',
  HINDI:   'हिन्दी',
  BENGALI: 'বাংলা',
  TAMIL:   'தமிழ்',
  TELUGU:  'తెలుగు',
  KANNADA: 'ಕನ್ನಡ',
  MARATHI: 'मराठी',
};

/* CDN server definitions */
const INDIA_SERVERS = [
  { label: 'FanCode India — Primary', tag: 'FAST',   tagClass: 'tag-green', key: 'fancode_cdn' },
  { label: 'FanCode India — Backup',  tag: 'STABLE', tagClass: 'tag-blue',  key: 'Primary_Playback_URL' },
];

const WORLD_SERVERS = [
  { label: 'Server — Bangladesh', tag: 'BD', tagClass: 'tag-blue',  key: 'fancode_bd_cdn' },
  { label: 'Server — Nepal',      tag: 'NP', tagClass: 'tag-amber', key: 'fancode_np_cdn' },
  { label: 'Server — Sri Lanka',  tag: 'LK', tagClass: 'tag-green', key: 'fancode_lk_cdn' },
];

const container = document.getElementById("matches-container");
let groups = [];   // grouped by match_id

/* ---------- INIT ---------- */
async function initApp() {
  try {
    const res  = await fetch(DATA_URL);
    const data = await res.json();
    groups = buildGroups(data.matches || []);
    renderAll();
  } catch(e) {
    container.innerHTML = '<p class="text-red-400 text-center col-span-3 mt-10">Failed to load matches. Please refresh.</p>';
  }
}

/* Group raw matches array by match_id */
function buildGroups(matches) {
  const map = new Map();
  matches.forEach(m => {
    const key = String(m.match_id);
    if (!map.has(key)) {
      map.set(key, { meta: m, langs: [], _sel: 0 });
    }
    const g = map.get(key);
    if (m.language && m.STREAMING_CDN) {
      g.langs.push({ language: m.language.toUpperCase(), cdn: m.STREAMING_CDN });
    }
  });
  return Array.from(map.values());
}

/* ---------- RENDER ---------- */
function renderAll() {
  container.innerHTML = "";
  groups.forEach((g, gi) => {
    const { meta, langs } = g;
    const isLive = (meta.status || "").toUpperCase() === "LIVE";

    /* Language tab pills */
    const tabsHtml = langs.length
      ? `<div class="lang-tabs" id="lt-${gi}">${
          langs.map((l, li) =>
            `<span class="lang-tab ${li===0?'active':''}"
                   onclick="pickLang(event,${gi},${li})">
               ${LANG_MAP[l.language] || l.language}
             </span>`
          ).join('')
        }</div>`
      : '';

    /* Score row for live football/other */
    let scoreHtml = '';
    if (isLive && meta.team?.length >= 2) {
      const [t1, t2] = meta.team;
      const s1 = t1.footballScore?.points ?? t1.kabaddiScore?.points ?? t1.basketBallScore?.points ?? null;
      const s2 = t2.footballScore?.points ?? t2.kabaddiScore?.points ?? t2.basketBallScore?.points ?? null;
      if (s1 !== null && s2 !== null) {
        scoreHtml = `
          <div class="score-row">
            <img src="${t1.flag?.src||''}" class="team-flag" onerror="this.style.display='none'">
            <span class="score-num">${s1}</span>
            <span class="score-sep">–</span>
            <span class="score-num">${s2}</span>
            <img src="${t2.flag?.src||''}" class="team-flag" onerror="this.style.display='none'">
          </div>`;
      }
    }

    /* Watch buttons */
    const watchHtml = isLive
      ? `<div class="flex flex-col gap-3 mt-auto pt-2">
           <button class="btn-india" onclick="openModal(${gi},'india')">
             <i class="fas fa-desktop text-sm"></i> Watch Now — Indian Users
           </button>
           <button class="btn-world" onclick="openModal(${gi},'world')">
             <i class="fas fa-globe text-sm"></i> Watch Now — Worldwide
           </button>
         </div>`
      : `<div class="btn-notlive mt-auto">
           <i class="fas fa-clock mr-2"></i>NOT LIVE YET
         </div>`;

    const card = document.createElement("div");
    card.className = "match-tile";
    card.innerHTML = `
      <div class="img-wrapper">
        <img src="${meta.image}" class="match-img" loading="lazy"
             onerror="this.src='https://via.placeholder.com/400x200/131d2f/253247?text=No+Image'">
        ${isLive ? '<span class="live-badge">● LIVE</span>' : ''}
        ${tabsHtml}
      </div>
      <div class="p-5 flex flex-col flex-grow gap-1">
        <h3 class="font-bold text-base leading-snug">${meta.title}</h3>
        <p class="text-blue-400 text-xs font-semibold">${meta.tournament}</p>
        ${scoreHtml}
        <p class="text-gray-500 text-xs mb-2">${meta.startTime}</p>
        ${watchHtml}
      </div>`;
    container.appendChild(card);
  });
}

/* ---------- LANG SELECTION ---------- */
function pickLang(e, gi, li) {
  e.stopPropagation();
  groups[gi]._sel = li;
  document.querySelectorAll(`#lt-${gi} .lang-tab`).forEach((t,i) => {
    t.classList.toggle('active', i === li);
  });
}

/* ---------- MODAL ---------- */
function openModal(gi, mode) {
  const g      = groups[gi];
  const entry  = g.langs[g._sel] || g.langs[0];
  if (!entry) return;

  const langLabel = LANG_MAP[entry.language] || entry.language;
  const cdn       = entry.cdn;

  document.getElementById('modal-title').textContent =
    mode === 'india' ? '🇮🇳  Indian Servers' : '🌍  Worldwide Servers';
  document.getElementById('modal-sub').textContent =
    `${g.meta.title}  ·  ${langLabel}`;

  const list    = document.getElementById("cdn-list");
  list.innerHTML = "";
  const servers  = mode === 'india' ? INDIA_SERVERS : WORLD_SERVERS;
  let added      = 0;

  servers.forEach(s => {
    const url = cdn[s.key];
    if (url && url !== 'Unavailable' && url !== '') {
      const btn = document.createElement('div');
      btn.className = 'cdn-btn';
      btn.innerHTML  = `<span>${s.label}</span>
                        <span class="cdn-tag ${s.tagClass}">${s.tag}</span>`;
      btn.onclick    = () => goWatch(g.meta.match_id, entry.language, s.key);
      list.appendChild(btn);
      added++;
    }
  });

  if (!added) {
    list.innerHTML = `<p class="no-cdn">No servers available for this region.</p>`;
  }

  document.getElementById("quality-modal").style.display = "flex";
}

function goWatch(matchId, language, cdnKey) {
  closeModal();
  const p = new URLSearchParams({ id: matchId, lang: language, cdn: cdnKey });
  window.location.href = `Watch.html?${p.toString()}`;
}

function closeModal() {
  document.getElementById("quality-modal").style.display = "none";
}

initApp();
</script>
</body>
</html>
