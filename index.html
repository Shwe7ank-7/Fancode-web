 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fancode - @Shwe7ank</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{box-sizing:border-box;}
body{background:#070c17;font-family:system-ui,-apple-system,sans-serif;color:#e2e8f0;padding-bottom:60px;min-height:100vh;}

/* Header */
.header-logo{display:inline-flex;align-items:center;gap:10px;background:#111827;padding:14px 28px;border-radius:999px;border:1px solid #1e3a5f;box-shadow:0 0 30px rgba(59,130,246,.12);}

/* Cards */
.match-tile{background:#0f1929;border-radius:22px;border:1px solid #1a2d47;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,border-color .25s,box-shadow .25s;}
.match-tile:hover{transform:translateY(-4px);border-color:#2563eb;box-shadow:0 12px 30px -8px rgba(37,99,235,.25);}

/* Image */
.img-wrap{height:190px;position:relative;background:#131d2f;overflow:hidden;flex-shrink:0;}
.match-img{width:100%;height:100%;object-fit:cover;display:block;}

/* Badges */
.badge{position:absolute;top:11px;left:11px;font-size:10px;font-weight:800;letter-spacing:.5px;padding:4px 11px;border-radius:999px;}
.badge-live{background:#dc2626;display:flex;align-items:center;gap:5px;}
.badge-live::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
.badge-up{background:rgba(0,0,0,.65);border:1px solid #334155;color:#94a3b8;backdrop-filter:blur(4px);}
.badge-done{background:rgba(0,0,0,.65);border:1px solid #334155;color:#64748b;backdrop-filter:blur(4px);}
.badge-cat{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.72);font-size:9px;font-weight:800;padding:3px 9px;border-radius:999px;color:#cbd5e1;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.08);letter-spacing:.4px;}

/* Lang pills on image */
.lang-row{position:absolute;top:11px;right:11px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:65%;}
.lang-pill{background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.15);color:#cbd5e1;font-size:10px;font-weight:700;padding:4px 10px;border-radius:999px;cursor:pointer;transition:.15s;backdrop-filter:blur(6px);user-select:none;white-space:nowrap;}
.lang-pill.active{background:#1d4ed8;border-color:#3b82f6;color:#fff;}
.lang-pill:hover:not(.active){background:rgba(255,255,255,.12);color:#fff;}

/* Card body */
.card-body{padding:16px 18px 18px;display:flex;flex-direction:column;flex-grow:1;gap:3px;}
.card-title{font-size:15px;font-weight:800;line-height:1.35;color:#f1f5f9;}
.card-tourn{font-size:11px;font-weight:600;color:#3b82f6;}
.card-time{font-size:11px;color:#475569;margin-top:1px;}

/* Score */
.score-block{display:flex;align-items:center;gap:8px;margin:5px 0;padding:8px 12px;background:#0a1628;border-radius:12px;border:1px solid #1a2d47;}
.sc-team{display:flex;align-items:center;gap:5px;flex:1;}
.sc-flag{width:18px;height:18px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.sc-name{font-size:10px;font-weight:700;color:#94a3b8;}
.sc-runs{font-size:13px;font-weight:900;color:#f1f5f9;white-space:nowrap;}
.sc-bat{color:#fbbf24;}
.sc-sep{font-size:11px;color:#334155;font-weight:700;}
.score-fb{display:flex;align-items:center;justify-content:center;gap:10px;margin:5px 0;padding:8px 12px;background:#0a1628;border-radius:12px;border:1px solid #1a2d47;}
.fb-team{display:flex;align-items:center;gap:5px;flex:1;}
.fb-team.r{flex-direction:row-reverse;}
.fb-num{font-size:22px;font-weight:900;color:#f1f5f9;min-width:18px;text-align:center;}
.fb-sep{font-size:18px;color:#334155;font-weight:700;}
.fb-name{font-size:11px;font-weight:700;color:#94a3b8;}

/* Buttons */
.btn-area{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:8px;}
.btn-india{background:#1d4ed8;color:#fff;padding:13px 16px;border-radius:13px;font-weight:800;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:none;width:100%;transition:background .2s;}
.btn-india:hover{background:#1e40af;}
.btn-india.open{background:#1e40af;}
.btn-world{background:transparent;color:#64748b;padding:12px 16px;border-radius:13px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #1e2d44;width:100%;transition:all .2s;}
.btn-world:hover{border-color:#3b82f6;color:#93c5fd;}
.btn-notlive{background:#0d1726;color:#334155;padding:13px 16px;border-radius:13px;font-weight:700;font-size:13px;text-align:center;border:1px solid #141f30;cursor:default;user-select:none;}

/* Quality panel */
.q-panel{display:none;flex-direction:column;gap:7px;}
.q-panel.open{display:flex;animation:slideDown .2s ease;}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.q-btn{background:#dc2626;color:#fff;padding:14px;border-radius:13px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;border:none;width:100%;transition:background .15s,transform .1s;letter-spacing:.2px;}
.q-btn:hover{background:#b91c1c;}
.q-btn:active{transform:scale(.97);}

/* Modal */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;align-items:center;justify-content:center;padding:20px;}
.modal-ov.open{display:flex;}
.modal-box{background:#0f1929;width:100%;max-width:360px;border-radius:26px;border:1px solid #1e3050;overflow:hidden;box-shadow:0 24px 60px -12px rgba(0,0,0,.8);}
.modal-head{padding:20px 22px 0;font-size:17px;font-weight:900;color:#f1f5f9;}
.modal-sub{padding:4px 22px 14px;font-size:12px;color:#475569;line-height:1.5;border-bottom:1px solid #1a2d47;}
.modal-body{padding:14px 14px 6px;}
.srv-btn{background:#0a1628;border:1px solid #1a2d47;width:100%;padding:13px 16px;margin-bottom:9px;border-radius:14px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:border-color .2s,background .2s;color:#e2e8f0;}
.srv-btn:hover{border-color:#3b82f6;background:#0d1e38;}
.srv-tag{font-size:10px;font-weight:800;letter-spacing:.4px;padding:3px 9px;border-radius:999px;}
.tag-b{background:#1e3a5f;color:#60a5fa;}
.tag-y{background:#451a03;color:#fb923c;}
.tag-p{background:#2e1065;color:#c084fc;}
.modal-close{display:block;text-align:center;padding:14px;font-size:13px;font-weight:700;color:#ef4444;cursor:pointer;border-top:1px solid #1a2d47;transition:color .2s;letter-spacing:.4px;}
.modal-close:hover{color:#f87171;}
.no-srv{text-align:center;color:#475569;font-size:13px;padding:12px 0;}

/* Filters */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
.f-btn{padding:7px 16px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid #1a2d47;background:#0f1929;color:#64748b;transition:all .2s;}
.f-btn.active{background:#1d4ed8;border-color:#2563eb;color:#fff;}
.f-btn:hover:not(.active){border-color:#2563eb;color:#93c5fd;}

/* Stats */
.stat-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid;}
</style>
<script src="https://semicolondriverelevated.com/1d/6a/57/1d6a575d756ceeb65888fb8b7328a1e6.js"></script>
</head>
<body class="p-4 max-w-7xl mx-auto">

<!-- Header -->
<div class="text-center mb-8 mt-4">
  <div class="header-logo">
    <i class="fas fa-bolt text-yellow-400 text-lg"></i>
    <span class="text-2xl font-black tracking-wide">FANCODE</span>
  </div>
  <p class="text-gray-600 text-xs mt-2 tracking-widest">BY @Shwe7ank</p>
</div>

<!-- Stats -->
<div id="stats-row" class="flex gap-3 justify-center flex-wrap mb-5" style="display:none!important">
  <span id="s-live"  class="stat-pill" style="background:rgba(220,38,38,.15);border-color:#991b1b;color:#f87171;"></span>
  <span id="s-up"   class="stat-pill" style="background:rgba(37,99,235,.15);border-color:#1e3a5f;color:#60a5fa;"></span>
  <span id="s-total"class="stat-pill" style="background:#0f1929;border-color:#1a2d47;color:#64748b;"></span>
</div>

<!-- Filters -->
<div class="filter-bar" id="filter-bar" style="display:none">
  <button class="f-btn active" onclick="setFilter('all',this)">All</button>
  <button class="f-btn"        onclick="setFilter('LIVE',this)">🔴 Live</button>
  <button class="f-btn"        onclick="setFilter('NOT_STARTED',this)">⏰ Upcoming</button>
  <button class="f-btn"        onclick="setFilter('COMPLETED',this)">✓ Completed</button>
</div>

<!-- Grid -->
<div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
  <div class="col-span-3 text-center py-20" id="loader">
    <div style="font-size:32px;margin-bottom:12px">⚡</div>
    <p class="text-gray-500 text-sm">Loading matches…</p>
  </div>
</div>

<!-- Worldwide modal -->
<div id="modal" class="modal-ov" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-head" id="m-title"></div>
    <div class="modal-sub"  id="m-sub"></div>
    <div class="modal-body" id="m-body"></div>
    <div class="modal-close" onclick="closeModal()">✕ &nbsp;CLOSE</div>
  </div>
</div>

<script>
const DATA_URL = "https://famcodexwebs.xojiv79335.workers.dev/";

const LANG_LABEL = {
  ENGLISH:'English', HINDI:'हिन्दी', BENGALI:'বাংলা',
  TAMIL:'தமிழ்', TELUGU:'తెలుగు', KANNADA:'ಕನ್ನಡ', MARATHI:'मराठी'
};

// Fixed quality list — always show these
const QUALITIES = ['240p','360p','480p','540p','720p','1080p'];

let groups = [];
let activeFilter = 'all';

// ── INIT ──────────────────────────────────────────
async function init() {
  try {
    const res  = await fetch(DATA_URL);
    const data = await res.json();
    groups = buildGroups(data.matches || []);
    showStats(data);
    document.getElementById('filter-bar').style.display = 'flex';
    render();
  } catch(e) {
    document.getElementById('loader').innerHTML =
      '<p class="text-red-400 text-sm">⚠️ Failed to load matches. Please refresh.</p>';
  }
}

// ── GROUP by match_id ─────────────────────────────
function buildGroups(matches) {
  const map = new Map();
  matches.forEach(m => {
    const id   = String(m.match_id);
    const lang = (m.language || '').toUpperCase();

    // Always add the group with at least meta info
    if (!map.has(id)) {
      map.set(id, { meta: m, langs: [], _sel: 0, _open: false });
    }
    const g = map.get(id);

    // Skip if no real stream
    if (lang === 'BLOODY_SWEET' || !m.STREAMING_CDN) return;
    const cdn = m.STREAMING_CDN;
    if (!cdn.fancode_cdn && !cdn.Primary_Playback_URL) return;

    // Avoid duplicate languages
    if (g.langs.find(l => l.language === lang)) return;

    // ── Build quality URLs from backup CDN base ──
    // backup.fancode_cdn = "https://in-mc-fblive.fancode.com/.../index.m3u8"
    // quality URL        = "https://in-mc-fblive.fancode.com/.../540p.m3u8"
    const backupBase = cdn.backup?.fancode_cdn || cdn.fancode_cdn || cdn.Primary_Playback_URL || '';
    const streamBase = backupBase.replace(/\/index\.m3u8$/, '');

    const qualities = QUALITIES.map(q => ({
      label: q,
      url: streamBase + '/' + q + '.m3u8'
    }));

    g.langs.push({ language: lang, cdn, qualities, streamBase });
  });
  return Array.from(map.values());
}

// ── STATS ─────────────────────────────────────────
function showStats(data) {
  const row = document.getElementById('stats-row');
  row.style.setProperty('display','flex','important');
  document.getElementById('s-live' ).textContent = `● ${data.live_matches} LIVE`;
  document.getElementById('s-up'   ).textContent = `⏰ ${data.upcoming_matches} UPCOMING`;
  document.getElementById('s-total').textContent = `📺 ${data.total_matches} TOTAL`;
}

// ── FILTER ────────────────────────────────────────
function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

// ── RENDER ────────────────────────────────────────
function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const list = groups.filter(g =>
    activeFilter === 'all' || (g.meta.status||'').toUpperCase() === activeFilter
  );
  if (!list.length) {
    grid.innerHTML = '<div class="col-span-3 text-center py-16 text-gray-600 text-sm">No matches found.</div>';
    return;
  }
  list.forEach((g, gi) => grid.appendChild(makeCard(g, gi)));
}

// ── CARD ──────────────────────────────────────────
function makeCard(g, gi) {
  const { meta, langs } = g;
  const status = (meta.status || '').toUpperCase();
  const isLive = status === 'LIVE';
  const isDone = status === 'COMPLETED';

  const badgeHtml = isLive
    ? '<span class="badge badge-live">LIVE</span>'
    : isDone
      ? '<span class="badge badge-done">COMPLETED</span>'
      : '<span class="badge badge-up">UPCOMING</span>';

  const catHtml = meta.category
    ? `<span class="badge-cat">${meta.category.toUpperCase()}</span>` : '';

  // Language pills — only for live matches with real streams
  let langHtml = '';
  if (isLive && langs.length > 0) {
    langHtml = `<div class="lang-row" id="lr${gi}">
      ${langs.map((l, li) =>
        `<span class="lang-pill ${li===0?'active':''}" onclick="pickLang(event,${gi},${li})">
          ${LANG_LABEL[l.language] || l.language}
        </span>`).join('')}
    </div>`;
  }

  const scoreHtml = makeScore(meta, isLive);

  // Action buttons
  let btnsHtml = '';
  if (isLive && langs.length > 0) {
    btnsHtml = `
      <div class="btn-area">
        <button class="btn-india" id="bi${gi}" onclick="toggleQuality(${gi})">
          <i class="fas fa-desktop" style="font-size:12px"></i>
          Watch Now — Indian Users
        </button>
        <div class="q-panel" id="qp${gi}"></div>
        <button class="btn-world" onclick="openWorldModal(${gi})">
          <i class="fas fa-globe" style="font-size:12px"></i>
          Watch Now — Worldwide
        </button>
      </div>`;
  } else if (isDone) {
    btnsHtml = `<div class="btn-area">
      <div class="btn-notlive"><i class="fas fa-check-circle mr-2"></i>MATCH COMPLETED</div>
    </div>`;
  } else {
    btnsHtml = `<div class="btn-area">
      <div class="btn-notlive"><i class="fas fa-clock mr-2"></i>STARTS ${meta.startTime}</div>
    </div>`;
  }

  const div = document.createElement('div');
  div.className = 'match-tile';
  div.innerHTML = `
    <div class="img-wrap">
      <img class="match-img" src="${meta.image}" loading="lazy"
           onerror="this.src='https://via.placeholder.com/400x200/0f1929/1a2d47?text=No+Image'">
      ${badgeHtml}${catHtml}${langHtml}
    </div>
    <div class="card-body">
      <div class="card-title">${meta.title}</div>
      <div class="card-tourn">${meta.tournament}</div>
      ${scoreHtml}
      <div class="card-time">${meta.startTime}</div>
      ${btnsHtml}
    </div>`;
  return div;
}

// ── SCORE ─────────────────────────────────────────
function makeScore(meta, isLive) {
  if (!isLive || !meta.team || meta.team.length < 2) return '';
  const [t1, t2] = meta.team;

  // Football
  if (t1.footballScore !== null && t1.footballScore !== undefined) {
    const s1 = t1.footballScore?.points ?? 0;
    const s2 = t2.footballScore?.points ?? 0;
    return `<div class="score-fb">
      <div class="fb-team">
        <img src="${t1.flag?.src||''}" class="sc-flag" onerror="this.style.display='none'">
        <span class="fb-name">${t1.shortName}</span>
      </div>
      <span class="fb-num">${s1}</span>
      <span class="fb-sep">–</span>
      <span class="fb-num">${s2}</span>
      <div class="fb-team r">
        <img src="${t2.flag?.src||''}" class="sc-flag" onerror="this.style.display='none'">
        <span class="fb-name">${t2.shortName}</span>
      </div>
    </div>`;
  }

  // Cricket
  const hasCr = t => Array.isArray(t.cricketScore) && t.cricketScore.length > 0;
  if (hasCr(t1) || hasCr(t2)) {
    const fmt = t => {
      if (!hasCr(t)) return '–';
      const s = t.cricketScore[0];
      return `${s.runs}/${s.wickets} (${s.overs})`;
    };
    return `<div class="score-block">
      <div class="sc-team">
        <img src="${t1.flag?.src||''}" class="sc-flag" onerror="this.style.display='none'">
        <span class="sc-name">${t1.shortName}</span>
      </div>
      <span class="sc-runs ${t1.status?.cricket?.isBatting?'sc-bat':''}">${fmt(t1)}</span>
      <span class="sc-sep">|</span>
      <span class="sc-runs ${t2.status?.cricket?.isBatting?'sc-bat':''}">${fmt(t2)}</span>
      <div class="sc-team" style="justify-content:flex-end">
        <span class="sc-name">${t2.shortName}</span>
        <img src="${t2.flag?.src||''}" class="sc-flag" onerror="this.style.display='none'">
      </div>
    </div>`;
  }
  return '';
}

// ── LANG PICK ─────────────────────────────────────
function pickLang(e, gi, li) {
  e.stopPropagation();
  groups[gi]._sel = li;
  document.querySelectorAll(`#lr${gi} .lang-pill`)
    .forEach((p, i) => p.classList.toggle('active', i === li));
  // Collapse quality panel if open
  collapseQuality(gi);
}

// ── TOGGLE QUALITY ────────────────────────────────
function toggleQuality(gi) {
  const g   = groups[gi];
  const sel = g.langs[g._sel] || g.langs[0];
  const btn = document.getElementById(`bi${gi}`);
  const panel = document.getElementById(`qp${gi}`);

  if (!sel || !sel.qualities || !sel.qualities.length) return;

  if (g._open) {
    collapseQuality(gi);
    return;
  }

  // Open — fill quality buttons
  g._open = true;
  btn.classList.add('open');
  btn.innerHTML = '<i class="fas fa-desktop" style="font-size:12px"></i> Watch Now — Indian Users ▲';

  panel.innerHTML = '';
  sel.qualities.forEach(q => {
    const b = document.createElement('button');
    b.className = 'q-btn';
    b.innerHTML = `<i class="fas fa-play" style="font-size:11px"></i>${q.label}`;
    b.onclick = () => goWatch(q.url, sel.cdn?.drm, g.meta.title);
    panel.appendChild(b);
  });
  panel.classList.add('open');
}

function collapseQuality(gi) {
  const g   = groups[gi];
  const btn = document.getElementById(`bi${gi}`);
  const panel = document.getElementById(`qp${gi}`);
  g._open = false;
  if (btn) {
    btn.classList.remove('open');
    btn.innerHTML = '<i class="fas fa-desktop" style="font-size:12px"></i> Watch Now — Indian Users';
  }
  if (panel) { panel.classList.remove('open'); panel.innerHTML = ''; }
}

// ── WORLDWIDE MODAL ───────────────────────────────
function openWorldModal(gi) {
  const g   = groups[gi];
  const sel = g.langs[g._sel] || g.langs[0];
  if (!sel) return;

  document.getElementById('m-title').textContent = '🌍 Worldwide Servers';
  document.getElementById('m-sub').textContent   =
    `${g.meta.title} · ${LANG_LABEL[sel.language] || sel.language}`;

  const body = document.getElementById('m-body');
  body.innerHTML = '';

  const WORLD = [
    { label:'Server — Bangladesh', key:'fancode_bd_cdn', tag:'BD', cls:'tag-b' },
    { label:'Server — Nepal',      key:'fancode_np_cdn', tag:'NP', cls:'tag-y' },
    { label:'Server — Sri Lanka',  key:'fancode_lk_cdn', tag:'LK', cls:'tag-p' },
  ];

  let count = 0;
  WORLD.forEach(s => {
    const url = sel.cdn?.[s.key];
    if (!url || url === 'Unavailable' || url === '') return;
    const btn = document.createElement('div');
    btn.className = 'srv-btn';
    btn.innerHTML = `<span>${s.label}</span><span class="srv-tag ${s.cls}">${s.tag}</span>`;
    btn.onclick = () => { closeModal(); goWatch(url, sel.cdn?.drm, g.meta.title); };
    body.appendChild(btn);
    count++;
  });

  if (!count) {
    body.innerHTML = '<p class="no-srv">No worldwide servers available right now.</p>';
  }
  document.getElementById('modal').classList.add('open');
}

// ── NAVIGATE TO PLAYER ────────────────────────────
function goWatch(url, drm, title) {
  // Build DRM string from drm object
  let drmStr = '';
  if (drm) {
    if (Array.isArray(drm.keys) && drm.keys.length) drmStr = drm.keys.join(',');
    else if (drm.clearkey) drmStr = drm.clearkey;
  }
  const p = new URLSearchParams({ url, drm: drmStr, title: title || '' });
  window.location.href = 'Watch.html?' + p.toString();
}

// ── MODAL CLOSE ───────────────────────────────────
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

init();
</script>
</body>
</html>
