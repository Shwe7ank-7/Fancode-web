<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fancode - @Shwe7ank</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
margin:0;
background:#0f0f0f;
color:#fff;
font-family:system-ui;
}

.container{
max-width:700px;
margin:auto;
padding:15px;
}

.card{
background:#1a1a1a;
border-radius:14px;
margin-bottom:18px;
overflow:hidden;
border:2px solid #e50914;
}

.card img{
width:100%;
display:block;
}

.card-body{
padding:15px;
}

.title{
font-size:18px;
font-weight:700;
margin-bottom:6px;
}

.meta{
opacity:.8;
font-size:14px;
margin-bottom:10px;
}

.btn{
display:block;
width:100%;
background:#e50914;
color:#fff;
text-align:center;
padding:12px;
border-radius:8px;
margin-top:8px;
text-decoration:none;
font-weight:700;
}

.live{
position:absolute;
background:#e50914;
padding:4px 8px;
border-radius:6px;
font-size:12px;
top:10px;
left:10px;
}

.img-wrap{
position:relative;
}

</style>
</head>

<body>

<div class="container" id="matches"></div>

<script>

const JSON_URL="https://raw.githubusercontent.com/Jitendra-unatti/fancode/refs/heads/main/data/fancode.json";

async function loadMatches(){

const res=await fetch(JSON_URL);
const data=await res.json();

const container=document.getElementById("matches");

data.matches.forEach(match=>{

const card=document.createElement("div");
card.className="card";

card.innerHTML=`

<div class="img-wrap">
${match.status==="LIVE"?'<div class="live">LIVE</div>':''}
<img src="${match.image}">
</div>

<div class="card-body">

<div class="title">${match.title}</div>

<div class="meta">
${match.tournament}<br>
${match.startTime}<br>
${match.language}
</div>

<a class="btn" href="Watch.html?id=${match.match_id}">
▶ Watch Now
</a>

</div>
`;

container.appendChild(card);

});

}

loadMatches();

</script>

</body>
</html>
