<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FanCode Live</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>

<style>

body{
background:#0b132b;
color:white;
margin:0;
font-family:sans-serif;
}

.container{
max-width:900px;
margin:auto;
padding:12px;
}

video{
width:100%;
background:black;
border-radius:8px;
}

.match{
display:flex;
gap:10px;
padding:10px;
margin-top:12px;
background:#1c2541;
border-radius:8px;
cursor:pointer;
}

.match img{
width:120px;
border-radius:6px;
}

.quality{
margin-top:10px;
display:flex;
gap:8px;
flex-wrap:wrap;
}

.qbtn{
background:#3a506b;
padding:6px 10px;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>FanCode Live Matches</h2>

<video id="video" controls autoplay playsinline></video>

<div id="qualities" class="quality"></div>

<div id="matches"></div>

</div>

<script>

const JSON_API="https://raw.githubusercontent.com/Jitendra-unatti/fancode/refs/heads/main/data/fancode.json";

let player;
let currentMatchId;

async function loadMatches(){

const res=await fetch(JSON_API);
const data=await res.json();

const container=document.getElementById("matches");
container.innerHTML="";

data.matches.forEach(match=>{

if(!match.auto_streams) return;

const text=match.auto_streams[0].auto;

if(!text) return;

const firstUrl=text.match(/https:\/\/[^\n]+\.m3u8[^\n]*/);

if(!firstUrl) return;

const streamUrl=firstUrl[0];

const div=document.createElement("div");

div.className="match";

div.innerHTML=`
<img src="${match.image}">
<div>
<div>${match.title}</div>
<div>${match.tournament}</div>
<div>${match.status}</div>
</div>
`;

div.onclick=()=>playStream(streamUrl,match.match_id);

container.appendChild(div);

});

}

async function playStream(url,matchId){

currentMatchId=matchId;

const video=document.getElementById("video");

if(player){
await player.destroy();
}

player=new shaka.Player(video);

player.getNetworkingEngine().registerRequestFilter((type,request)=>{

request.headers["User-Agent"]="ReactNativeVideo/9.3.0 (Linux;Android 13) AndroidXMedia3/1.6.1";
request.headers["Referer"]="https://fancode.com/";
request.headers["Origin"]="https://fancode.com";

});

try{

await player.load(url);

video.play();

createQualityButtons();

}catch(err){

console.error(err);
alert("Stream failed to load");

}

}

function createQualityButtons(){

const tracks=player.getVariantTracks();

const container=document.getElementById("qualities");
container.innerHTML="";

tracks.forEach(track=>{

if(!track.height) return;

const btn=document.createElement("div");

btn.className="qbtn";
btn.innerText=track.height+"p";

btn.onclick=()=>{

player.configure({abr:{enabled:false}});
player.selectVariantTrack(track,true);

};

container.appendChild(btn);

});

}

setInterval(async()=>{

if(!currentMatchId) return;

const res=await fetch(JSON_API);
const data=await res.json();

const match=data.matches.find(m=>m.match_id===currentMatchId);

if(!match) return;

const text=match.auto_streams[0].auto;

const firstUrl=text.match(/https:\/\/[^\n]+\.m3u8[^\n]*/);

if(!firstUrl) return;

const newUrl=firstUrl[0];

await player.load(newUrl);

console.log("Token refreshed");

},120000);

loadMatches();

</script>

</body>
</html>
