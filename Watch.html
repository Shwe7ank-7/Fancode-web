<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FanCode Live</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>

<style>

body{
margin:0;
background:#0b132b;
font-family:sans-serif;
color:white;
}

.container{
max-width:900px;
margin:auto;
padding:12px;
}

video{
width:100%;
background:black;
border-radius:8px;
}

.match{
display:flex;
gap:12px;
background:#1c2541;
padding:10px;
margin-top:12px;
border-radius:8px;
cursor:pointer;
}

.match img{
width:120px;
border-radius:6px;
}

.qbar{
margin-top:10px;
display:flex;
gap:8px;
flex-wrap:wrap;
}

.qbtn{
background:#3a506b;
padding:6px 10px;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>FanCode Live Matches</h2>

<video id="video" controls autoplay></video>

<div id="qualities" class="qbar"></div>

<div id="matches"></div>

</div>

<script>

const API="https://raw.githubusercontent.com/Jitendra-unatti/fancode/refs/heads/main/data/fancode.json";

let player=null;
let currentMatch=null;

async function loadMatches(){

const res=await fetch(API);
const data=await res.json();

const matches=data.matches;

const container=document.getElementById("matches");
container.innerHTML="";

matches.forEach(match=>{

if(!match.auto_streams) return;

const auto=match.auto_streams[0].auto;

if(!auto) return;

const master=auto.match(/https.*\.m3u8.*/);

if(!master) return;

const streamUrl=master[0];

const div=document.createElement("div");

div.className="match";

div.innerHTML=`
<img src="${match.image}">
<div>
<div>${match.title}</div>
<div>${match.tournament}</div>
<div>${match.status}</div>
</div>
`;

div.onclick=()=>play(streamUrl,match);

container.appendChild(div);

});

}

async function play(url,match){

currentMatch=match;

if(player){
await player.destroy();
}

const video=document.getElementById("video");

player=new shaka.Player(video);

player.getNetworkingEngine().registerRequestFilter((type,request)=>{

request.headers["User-Agent"]="ReactNativeVideo/9.3.0 (Linux;Android 13) AndroidXMedia3/1.6.1";
request.headers["Referer"]="https://fancode.com/";
request.headers["Origin"]="https://fancode.com";

});

try{

await player.load(url);

video.play();

buildQuality();

}catch(e){

console.log(e);
alert("Stream failed");

}

}

function buildQuality(){

const tracks=player.getVariantTracks();

const q=document.getElementById("qualities");
q.innerHTML="";

tracks.forEach(track=>{

const btn=document.createElement("div");

btn.className="qbtn";

btn.innerText=track.height+"p";

btn.onclick=()=>{

player.configure({abr:{enabled:false}});

player.selectVariantTrack(track,true);

};

q.appendChild(btn);

});

}

setInterval(async()=>{

if(!currentMatch) return;

const now=Math.floor(Date.now()/1000);

const res=await fetch(API);
const data=await res.json();

const matches=data.matches;

for(let m of matches){

if(m.match_id===currentMatch.match_id){

const auto=m.auto_streams[0].auto;

const master=auto.match(/https.*\.m3u8.*/)[0];

player.load(master);

break;

}

}

},120000);

loadMatches();

</script>

</body>
</html>
