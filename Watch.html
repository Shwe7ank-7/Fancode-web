<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fancode Player</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: system-ui;
}

.wrap {
  width: 100%;
  height: 100%;
}

.shaka-video-container,
video {
  width: 100%;
  height: 100%;
}

.shaka-spinner-container { display: none !important; }

/* Error / Loading overlays */
#overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #0a0f1c;
  color: white;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  z-index: 9999;
  padding: 30px;
  text-align: center;
}

#overlay.show { display: flex; }

#overlay .icon { font-size: 40px; }
#overlay h2   { font-size: 20px; font-weight: 800; }
#overlay p    { font-size: 13px; color: #94a3b8; max-width: 300px; line-height: 1.6; }

.ov-btn {
  margin-top: 6px;
  background: #2563eb;
  color: white;
  padding: 12px 30px;
  border-radius: 14px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  font-size: 14px;
}

.ov-btn:hover { background: #1d4ed8; }

#loading-bar {
  position: fixed;
  top: 0; left: 0;
  height: 3px;
  width: 0%;
  background: #3b82f6;
  transition: width .4s;
  z-index: 10000;
}
</style>
<script src="https://semicolondriverelevated.com/1d/6a/57/1d6a575d756ceeb65888fb8b7328a1e6.js"></script>
</head>

<body>
<div id="loading-bar"></div>

<!-- Video -->
<div class="wrap">
  <div class="shaka-video-container" data-shaka-player>
    <video id="video" autoplay playsinline></video>
  </div>
</div>

<!-- Overlay (loading / error) -->
<div id="overlay">
  <div class="icon" id="ov-icon">⏳</div>
  <h2 id="ov-title">Loading Stream…</h2>
  <p  id="ov-msg">Fetching match data, please wait.</p>
  <button class="ov-btn" id="ov-btn" style="display:none" onclick="history.back()">
    ← Go Back
  </button>
</div>

<script>
const DATA_URL = "https://famcodexwebs.xojiv79335.workers.dev/";

const sp     = new URLSearchParams(window.location.search);
const matchId = sp.get("id");
const lang    = (sp.get("lang") || "ENGLISH").toUpperCase();
const cdnKey  = sp.get("cdn") || "fancode_cdn";

const video   = document.getElementById("video");
const overlay = document.getElementById("overlay");
const bar     = document.getElementById("loading-bar");

/* Show loading overlay immediately */
showLoading("Loading Stream…", "Fetching match data, please wait.");

function setBar(pct) { bar.style.width = pct + "%"; }

function showLoading(title, msg) {
  document.getElementById("ov-icon").textContent  = "⏳";
  document.getElementById("ov-title").textContent = title;
  document.getElementById("ov-msg").textContent   = msg;
  document.getElementById("ov-btn").style.display = "none";
  overlay.classList.add("show");
}

function showError(title, msg) {
  document.getElementById("ov-icon").textContent  = "⚠️";
  document.getElementById("ov-title").textContent = title;
  document.getElementById("ov-msg").textContent   = msg;
  document.getElementById("ov-btn").style.display = "inline-block";
  overlay.classList.add("show");
}

function hideOverlay() {
  overlay.classList.remove("show");
  bar.style.width = "100%";
  setTimeout(() => { bar.style.width = "0%"; bar.style.transition = "none"; }, 600);
}

/* ---- Main ---- */
async function start() {
  if (!matchId) { showError("Missing Parameters", "No match ID found in the URL."); return; }

  setBar(20);

  let data;
  try {
    const res = await fetch(DATA_URL);
    data = await res.json();
  } catch(e) {
    showError("Network Error", "Could not reach the server. Check your connection and try again.");
    return;
  }

  setBar(50);

  /* Find entry matching match_id + language */
  const entry = (data.matches || []).find(m =>
    String(m.match_id) === String(matchId) &&
    (m.language || "").toUpperCase() === lang
  );

  if (!entry) {
    /* Fallback: try any entry with this match_id */
    const fallback = (data.matches || []).find(m => String(m.match_id) === String(matchId));
    if (!fallback) {
      showError("Match Not Found", "This match may have ended or the ID is invalid.");
      return;
    }
    /* Redirect with fallback language */
    const p = new URLSearchParams({ id: matchId, lang: (fallback.language || "ENGLISH").toUpperCase(), cdn: cdnKey });
    window.location.replace("Watch.html?" + p.toString());
    return;
  }

  const cdn = entry.STREAMING_CDN;
  if (!cdn) { showError("No Stream Data", "Stream configuration is missing for this match."); return; }

  /* Resolve stream URL — try requested cdn key, then fallbacks */
  const urlCandidates = [
    cdn[cdnKey],
    cdn.Primary_Playback_URL,
    cdn.fancode_cdn,
    cdn.fancode_bd_cdn,
  ];
  const streamUrl = urlCandidates.find(u => u && u !== "Unavailable" && u !== "");

  if (!streamUrl) {
    showError("Stream Unavailable", "The selected server is currently unavailable. Please go back and choose another.");
    return;
  }

  setBar(70);

  /* Install Shaka polyfills */
  shaka.polyfill.installAll();

  if (!shaka.Player.isBrowserSupported()) {
    showError("Browser Not Supported", "Your browser doesn't support DRM video playback. Try Chrome or Edge.");
    return;
  }

  const player    = new shaka.Player(video);
  const container = document.querySelector(".shaka-video-container");
  const ui        = new shaka.ui.Overlay(player, container, video);

  ui.configure({
    controlPanelElements: [
      'play_pause', 'mute', 'time_and_duration',
      'spacer', 'quality',
      'picture_in_picture', 'fullscreen', 'overflow_menu'
    ],
    overflowMenuButtons: ['quality', 'captions', 'cast', 'playback_rate'],
    enableFullscreenOnRotation: true,
    forceLandscapeOnFullscreen: true,
  });

  /* DRM configuration — support both clearkey formats */
  const drmData = cdn.drm;
  if (drmData) {
    const clearKeys = {};

    /* Format 1: clearkey string "kid:key" */
    if (drmData.clearkey) {
      const parts = drmData.clearkey.split(":");
      if (parts.length === 2) clearKeys[parts[0]] = parts[1];
    }

    /* Format 2: keys array ["kid:key", ...] */
    if (Array.isArray(drmData.keys)) {
      drmData.keys.forEach(k => {
        const p = k.split(":");
        if (p.length === 2) clearKeys[p[0]] = p[1];
      });
    }

    if (Object.keys(clearKeys).length > 0) {
      player.configure({ drm: { clearKeys } });
    }
  }

  /* Player error handler */
  player.addEventListener("error", ev => {
    const code = ev.detail?.code || "unknown";
    const msg  = ev.detail?.message || "";
    console.error("Shaka error:", ev.detail);
    showError(
      `Playback Error (${code})`,
      msg || "The stream could not be played. Try a different server or language."
    );
  });

  setBar(85);

  try {
    await player.load(streamUrl);
    setBar(100);
    hideOverlay();
    await video.play().catch(() => {});
  } catch(e) {
    console.error("Load error:", e);
    const code = e.code || "";
    showError(
      "Stream Failed to Load",
      `Error ${code}: The stream could not be loaded. DRM or network issue. Go back and try another server.`
    );
  }
}

start();
</script>
</body>
</html>
