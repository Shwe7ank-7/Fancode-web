<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Watch Live</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}

#popup{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:999}
.popup-box{background:#FFD700;color:#000;padding:24px 20px;border-radius:14px;width:300px;text-align:center}
.popup-box h3{font-size:1.2rem;margin-bottom:8px}
.popup-box p{font-size:.9rem;margin-bottom:16px;opacity:.8}
.popup-box button{display:block;width:100%;background:#000;color:#FFD700;border:0;border-radius:8px;padding:11px;margin:7px 0;font-weight:700;cursor:pointer;font-size:.95rem}

/* views */
#quality-page,#player-page{display:none}
#quality-page.show,#player-page.show{display:block}

/* quality page */
.match-header{background:linear-gradient(135deg,#161b22,#1f2937);padding:20px 16px 24px;text-align:center;border-bottom:1px solid #30363d}
.match-logo{width:80px;height:80px;border-radius:12px;object-fit:cover;margin:0 auto 12px;display:block;border:2px solid #30363d;background:#111}
.match-name{font-size:1.15rem;font-weight:700;margin-bottom:4px;line-height:1.3}
.match-tourn{font-size:.82rem;color:#8b949e;text-transform:uppercase;letter-spacing:.5px}

.q-list{padding:16px}
.q-label{font-size:.75rem;color:#8b949e;text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:10px}
.q-item{display:flex;align-items:center;justify-content:space-between;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.q-item:hover,.q-item:active{background:#1f2937;border-color:#e50914;transform:translateX(4px)}
.q-left{display:flex;align-items:center;gap:14px}
.play-icon{width:36px;height:36px;background:#e50914;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.play-icon svg{margin-left:2px}
.q-name{font-size:1rem;font-weight:600}
.q-desc{font-size:.78rem;color:#8b949e;margin-top:2px}
.q-badge{padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:700}
.b1080{background:#7c3aed;color:#fff}.b720{background:#059669;color:#fff}
.b540,.b480{background:#2563eb;color:#fff}
.b360{background:#d97706;color:#fff}.b240{background:#4b5563;color:#fff}

/* player page */
#player-page{background:#000;min-height:100vh}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#111;border-bottom:1px solid #1e1e1e}
.back-btn{background:#1e1e1e;color:#ccc;border:1px solid #2a2a2a;border-radius:8px;padding:6px 14px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.back-btn:hover{background:#2a2a2a;color:#fff}
.now-lbl{font-size:.88rem;color:#888}.now-lbl strong{color:#fff}

#vwrap{width:100%;background:#000;position:relative}
video{width:100%;display:block;background:#000}

#vloader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);gap:12px;z-index:5}
.spin{width:40px;height:40px;border:4px solid #333;border-top-color:#e50914;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#vloader-txt{font-size:.9rem;color:#ccc}

#verr{display:none;margin:16px;padding:14px;background:#1a0000;border:1px solid #500;border-radius:8px;color:#f88;font-size:.85rem;line-height:1.7}
#verr button{margin-top:10px;background:#e50914;color:#fff;border:0;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:.85rem;display:block}

#iloader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:14px;color:#555;font-size:.9rem}
</style>
</head>
<body>

<div id="popup">
  <div class="popup-box">
    <h3>🔴 Support Us</h3>
    <p>Join Telegram for more live matches</p>
    <button onclick="window.open('https://t.me/+3sgGQcDP6ExhYTU1','_blank')">📲 Join Telegram</button>
    <button onclick="document.getElementById('popup').style.display='none'">✅ Already Joined</button>
  </div>
</div>

<div id="iloader"><div class="spin"></div>Loading match…</div>

<!-- Quality selector -->
<div id="quality-page">
  <div class="match-header">
    <img id="mlogo" class="match-logo" src="" alt="">
    <div class="match-name" id="mname"></div>
    <div class="match-tourn" id="mtourn"></div>
  </div>
  <div class="q-list">
    <div class="q-label">Select Quality to Watch</div>
    <div id="qitems"></div>
  </div>
</div>

<!-- Player -->
<div id="player-page">
  <div class="topbar">
    <button class="back-btn" onclick="goBack()">← Quality</button>
    <div class="now-lbl">Playing: <strong id="nowlbl"></strong></div>
  </div>
  <div id="vwrap">
    <video id="vid" controls playsinline webkit-playsinline></video>
    <div id="vloader"><div class="spin"></div><span id="vloader-txt">Connecting…</span></div>
  </div>
  <div id="verr"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
<script>
const JSON_URL = "https://raw.githubusercontent.com/Jitendra-unatti/fancode/refs/heads/main/data/fancode.json";
const QORDER   = ["240p","360p","480p","540p","720p","1080p"];
const QDESC    = {"1080p":"Full HD · Best quality","720p":"HD · Recommended","540p":"qHD · Balanced","480p":"SD · Smooth","360p":"Low · Data saver","240p":"Lowest · Minimal data"};
const QBADGE   = {"1080p":"b1080","720p":"b720","540p":"b540","480p":"b480","360p":"b360","240p":"b240"};

const params  = new URLSearchParams(location.search);
const matchId = params.get("id");
let   streams = [];
let   hls     = null;
const $       = id => document.getElementById(id);

function parseMaster(text){
  const lines = text.split(/\r?\n/), out = [];
  for(let i=0;i<lines.length;i++){
    if(lines[i].startsWith("#EXT-X-STREAM-INF")){
      const u = lines[i+1]?.trim();
      if(!u||u.startsWith("#")) continue;
      const m = u.match(/\/(\d+p)\.m3u8/i);
      if(m) out.push({quality:m[1].toLowerCase(), url:u});
    }
  }
  // sort highest first in selector, lowest first in bar
  return out.sort((a,b)=>QORDER.indexOf(b.quality)-QORDER.indexOf(a.quality));
}

function goBack(){
  $("player-page").classList.remove("show");
  $("quality-page").classList.add("show");
  $("vid").pause();
  if(hls){hls.destroy();hls=null;}
}

function buildQualityPage(match){
  $("mlogo").src  = match.image||"";
  $("mname").textContent  = match.title||"Live Match";
  $("mtourn").textContent = match.tournament||"";
  const c = $("qitems");
  c.innerHTML = "";
  streams.forEach(s=>{
    const d = document.createElement("div");
    d.className = "q-item";
    d.innerHTML = `
      <div class="q-left">
        <div class="play-icon"><svg width="14" height="16" viewBox="0 0 14 16" fill="white"><path d="M0 0L14 8 0 16z"/></svg></div>
        <div>
          <div class="q-name">${s.quality.toUpperCase()}</div>
          <div class="q-desc">${QDESC[s.quality]||""}</div>
        </div>
      </div>
      <span class="q-badge ${QBADGE[s.quality]||"b240"}">${s.quality.toUpperCase()}</span>`;
    d.onclick = ()=>startPlay(s);
    c.appendChild(d);
  });
}

function showErr(msg){
  $("vloader").style.display="none";
  $("verr").style.display="block";
  $("verr").innerHTML=`⚠️ ${msg}<button onclick="goBack()">← Choose another quality</button>`;
}

function startPlay(s){
  $("quality-page").classList.remove("show");
  $("player-page").classList.add("show");
  $("verr").style.display   = "none";
  $("vloader").style.display= "flex";
  $("vloader-txt").textContent = "Loading…";
  $("nowlbl").textContent   = s.quality.toUpperCase();
  if(hls){hls.destroy();hls=null;}

  const video = $("vid");

  /* ── Strategy 1: HLS.js direct (Android Chrome, Firefox, etc.) ── */
  if(Hls.isSupported()){
    hls = new Hls({
      enableWorker      : true,
      lowLatencyMode    : true,
      maxBufferLength   : 60,
      maxMaxBufferLength: 120,
      fragLoadingTimeOut: 20000,
      manifestLoadingTimeOut: 20000,
      levelLoadingTimeOut   : 20000,
      fragLoadingMaxRetry   : 6,
      manifestLoadingMaxRetry: 3,
      levelLoadingMaxRetry  : 4,
      fragLoadingRetryDelay : 1000,
    });

    hls.loadSource(s.url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
      $("vloader").style.display="none";
      video.play().catch(()=>{});
    });

    let errCount = 0;
    hls.on(Hls.Events.ERROR, (e,d)=>{
      if(!d.fatal){errCount++;return;}
      if(d.type===Hls.ErrorTypes.NETWORK_ERROR && errCount<5){
        $("vloader-txt").textContent="Retrying…";
        $("vloader").style.display="flex";
        setTimeout(()=>hls&&hls.startLoad(), 2000);
      } else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){
        hls.recoverMediaError();
      } else {
        /* HLS.js failed — fall back to native <video> src */
        hls.destroy(); hls=null;
        tryNative(s.url);
      }
    });

  } else {
    /* ── Strategy 2: Native HLS (iOS Safari) ── */
    tryNative(s.url);
  }
}

function tryNative(url){
  /* iOS Safari and some Android browsers handle .m3u8 natively */
  const video = $("vid");
  $("vloader-txt").textContent = "Loading…";
  $("vloader").style.display   = "flex";
  video.src = url;
  video.load();
  video.oncanplay = ()=>{ $("vloader").style.display="none"; video.play().catch(()=>{}); };
  video.onerror   = ()=>showErr("Could not play this stream. The token may have expired — go back to the main page and try again.");
}

async function init(){
  if(!matchId){$("iloader").innerHTML="<div style='color:#f55'>⚠️ No match ID.</div>";return;}
  try{
    const res  = await fetch(JSON_URL+"?_="+Date.now());
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    const match = data.matches.find(m=>String(m.match_id)===matchId);
    if(!match){$("iloader").innerHTML="<div style='color:#f55'>⚠️ Match not found or ended.</div>";return;}
    const txt = match.auto_streams?.[0]?.auto;
    if(!txt){$("iloader").innerHTML="<div style='color:#f55'>⚠️ No stream available.</div>";return;}
    streams = parseMaster(txt);
    if(!streams.length){$("iloader").innerHTML="<div style='color:#f55'>⚠️ No qualities found.</div>";return;}
    $("iloader").style.display="none";
    buildQualityPage(match);
    $("quality-page").classList.add("show");
  }catch(e){
    $("iloader").innerHTML=`<div style="color:#f55">⚠️ ${e.message}</div>`;
  }
}

init();
</script>
</body>
</html>
