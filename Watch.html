<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FanCode Live</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/shaka-player.compiled.js"></script>

<style>

body{
background:#0f172a;
margin:0;
font-family:sans-serif;
color:white;
}

.container{
max-width:900px;
margin:auto;
padding:10px;
}

video{
width:100%;
background:black;
border-radius:8px;
}

.match{
display:flex;
align-items:center;
gap:10px;
padding:10px;
background:#1e293b;
margin-top:10px;
border-radius:6px;
cursor:pointer;
}

.match img{
width:120px;
border-radius:4px;
}

.quality{
margin-top:10px;
display:flex;
gap:8px;
flex-wrap:wrap;
}

.qbtn{
background:#334155;
padding:6px 10px;
border-radius:4px;
cursor:pointer;
}

.qbtn:hover{
background:#475569;
}

</style>

</head>

<body>

<div class="container">

<h2>FanCode Live Matches</h2>

<video id="video" controls autoplay></video>

<div class="quality" id="qualities"></div>

<div id="matches"></div>

</div>

<script>

const API="https://raw.githubusercontent.com/Jitendra-unatti/fancode/refs/heads/main/data/fancode.json";

let player;
let currentStream="";
let expireTime=0;

async function init(){

const res=await fetch(API);
const data=await res.json();

const matches=data.matches;

const container=document.getElementById("matches");

matches.forEach(match=>{

const auto=match.auto_streams?.[0]?.auto;

if(!auto) return;

const url=auto.match(/https.*\.m3u8.*/)[0];

const expire=url.match(/Expires=(\d+)/);

const exp=expire?parseInt(expire[1]):0;

const div=document.createElement("div");

div.className="match";

div.innerHTML=`
<img src="${match.image}">
<div>
<div>${match.title}</div>
<div>${match.tournament}</div>
<div>${match.status}</div>
</div>
`;

div.onclick=()=>playStream(url,exp);

container.appendChild(div);

});

}

async function playStream(url,exp){

currentStream=url;
expireTime=exp;

if(player){
player.destroy();
}

const video=document.getElementById("video");

player=new shaka.Player(video);

player.getNetworkingEngine().registerRequestFilter((type,request)=>{

request.headers["User-Agent"]="ReactNativeVideo/9.3.0 (Linux;Android 13) AndroidXMedia3/1.6.1";

request.headers["Referer"]="https://fancode.com/";

request.headers["Origin"]="https://fancode.com";

});

try{

await player.load(url);

video.play();

buildQuality();

}catch(e){

console.log(e);

}

}

function buildQuality(){

const tracks=player.getVariantTracks();

const qDiv=document.getElementById("qualities");

qDiv.innerHTML="";

tracks.forEach(track=>{

const btn=document.createElement("div");

btn.className="qbtn";

btn.innerText=track.height+"p";

btn.onclick=()=>{

player.configure({abr:{enabled:false}});

player.selectVariantTrack(track,true);

};

qDiv.appendChild(btn);

});

}

setInterval(async()=>{

if(!expireTime) return;

const now=Math.floor(Date.now()/1000);

if(expireTime-now<120){

console.log("Token Expired Refreshing");

const res=await fetch(API);

const data=await res.json();

const matches=data.matches;

for(let m of matches){

const auto=m.auto_streams?.[0]?.auto;

if(!auto) continue;

const url=auto.match(/https.*\.m3u8.*/)[0];

if(url.includes(currentStream.split("/")[3])){

const expire=url.match(/Expires=(\d+)/);

const exp=expire?parseInt(expire[1]):0;

playStream(url,exp);

break;

}

}

}

},30000);

init();

</script>

</body>
</html>
