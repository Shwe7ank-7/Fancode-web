<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Watch Live</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}

/* popup */
#popup{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:999}
.popup-box{background:#FFD700;color:#000;padding:24px 20px;border-radius:14px;width:300px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.popup-box h3{font-size:1.2rem;margin-bottom:8px}
.popup-box p{font-size:.9rem;margin-bottom:16px;opacity:.8}
.popup-box button{display:block;width:100%;background:#000;color:#FFD700;border:0;border-radius:8px;padding:11px;margin:7px 0;font-weight:700;font-size:.95rem;cursor:pointer}

/* match info */
#match-info{padding:10px 14px;background:#111;border-bottom:1px solid #1a1a1a}
#match-title{font-size:1rem;font-weight:700;color:#fff;margin-bottom:2px}
#match-meta{font-size:.82rem;color:#888}

/* quality bar */
#quality-bar{display:flex;gap:8px;padding:10px 14px;background:#111;border-bottom:1px solid #222;overflow-x:auto;flex-wrap:wrap;scrollbar-width:none}
#quality-bar::-webkit-scrollbar{display:none}
.q-btn{background:#222;color:#ccc;border:1px solid #333;border-radius:6px;padding:6px 14px;font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
.q-btn:hover{background:#333;color:#fff}
.q-btn.active{background:#e50914;color:#fff;border-color:#e50914}

/* video */
#video-wrap{width:100%;background:#000;position:relative}
video{width:100%;display:block;background:#000}

/* loader overlay */
#loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.8);gap:14px;font-size:.9rem;color:#ccc;z-index:5}
.spinner{width:40px;height:40px;border:4px solid #333;border-top-color:#e50914;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* error */
#error-box{display:none;margin:20px 14px;padding:14px;background:#1a0000;border:1px solid #500;border-radius:8px;color:#f88;font-size:.88rem;line-height:1.6}

/* back btn */
#back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px 0;color:#888;font-size:.85rem;text-decoration:none;cursor:pointer;background:none;border:none}
#back-btn:hover{color:#fff}
</style>
</head>
<body>

<div id="popup">
  <div class="popup-box">
    <h3>🔴 Support Us</h3>
    <p>Join Telegram for more live matches</p>
    <button onclick="window.open('https://t.me/+tze-BpoZ4v01N2M1','_blank')">📲 Join Telegram</button>
    <button onclick="document.getElementById('popup').style.display='none'">✅ Already Joined</button>
  </div>
</div>

<button id="back-btn" onclick="history.back()">← Back</button>

<div id="match-info">
  <div id="match-title">Loading…</div>
  <div id="match-meta"></div>
</div>

<div id="quality-bar"></div>

<div id="video-wrap">
  <video id="player" controls playsinline></video>
  <div id="loader">
    <div class="spinner"></div>
    <span id="loader-text">Loading stream…</span>
  </div>
</div>

<div id="error-box"></div>

<script>
const JSON_URL = "https://raw.githubusercontent.com/Jitendra-unatti/fancode/refs/heads/main/data/fancode.json";
const QUALITY_ORDER = ["240p","360p","480p","540p","720p","1080p"];

const params  = new URLSearchParams(location.search);
const matchId = params.get("id");

const $id = id => document.getElementById(id);

function showError(msg){
  $id("loader").style.display = "none";
  $id("error-box").style.display = "block";
  $id("error-box").innerHTML = "⚠️ " + msg;
}
function setLoader(txt){ $id("loader-text").textContent = txt; }

/* ── Parse master playlist text → [{quality, url}] ── */
function parseMasterPlaylist(text, userAgent, referer){
  const lines   = text.split(/\r?\n/);
  const streams = [];
  for(let i=0; i<lines.length; i++){
    if(lines[i].startsWith("#EXT-X-STREAM-INF")){
      const urlLine = lines[i+1]?.trim();
      if(!urlLine) continue;
      const qMatch = urlLine.match(/\/(\d+p)\.m3u8/i);
      const quality = qMatch ? qMatch[1].toLowerCase() : null;
      if(quality) streams.push({ quality, url: urlLine, userAgent, referer });
    }
  }
  return streams.sort((a,b) => QUALITY_ORDER.indexOf(a.quality) - QUALITY_ORDER.indexOf(b.quality));
}

/* ── HLS player ── */
let hlsInstance  = null;
let plyrInstance = null;
let currentUrl   = null;

function startHLS(url, userAgent, referer){
  if(url === currentUrl) return;
  currentUrl = url;

  $id("loader").style.display = "flex";
  setLoader("Connecting…");

  const video = $id("player");
  if(hlsInstance){ hlsInstance.destroy(); hlsInstance = null; }

  if(Hls.isSupported()){
    hlsInstance = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      maxBufferLength: 30,
      // Inject Referer on every XHR request
      xhrSetup(xhr){
        try{ xhr.setRequestHeader("Referer", referer); }catch(e){}
      }
    });

    hlsInstance.loadSource(url);
    hlsInstance.attachMedia(video);

    hlsInstance.on(Hls.Events.MANIFEST_PARSED, ()=>{
      $id("loader").style.display = "none";
      video.play().catch(()=>{});
    });

    hlsInstance.on(Hls.Events.ERROR, (e, data)=>{
      if(data.fatal){
        if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
          setLoader("Network error – retrying…");
          hlsInstance.startLoad();
        } else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
          setLoader("Media error – recovering…");
          hlsInstance.recoverMediaError();
        } else {
          showError("Stream error. It may have expired or is geo-blocked.<br>Try refreshing the page.");
          hlsInstance.destroy();
        }
      }
    });

    if(!plyrInstance){
      plyrInstance = new Plyr(video,{
        controls:['play','progress','current-time','mute','volume','fullscreen'],
        settings:[],ratio:'16:9'
      });
    }

  } else if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src = url;
    $id("loader").style.display = "none";
    video.play().catch(()=>{});
    if(!plyrInstance){
      plyrInstance = new Plyr(video,{
        controls:['play','progress','current-time','mute','volume','fullscreen']
      });
    }
  } else {
    showError("Your browser doesn't support HLS streaming.");
  }
}

/* ── Build quality buttons ── */
function buildQualityBar(streams){
  const bar = $id("quality-bar");
  bar.innerHTML = "";
  streams.forEach((s, idx)=>{
    const btn = document.createElement("button");
    btn.className = "q-btn" + (idx===0?" active":"");
    btn.textContent = s.quality.toUpperCase();
    btn.onclick = ()=>{
      bar.querySelectorAll(".q-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      startHLS(s.url, s.userAgent, s.referer);
    };
    bar.appendChild(btn);
  });
}

/* ── Main ── */
async function loadStream(){
  if(!matchId){ showError("No match ID in URL."); return; }

  try{
    setLoader("Fetching match data…");
    const res  = await fetch(JSON_URL + "?_=" + Date.now());
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();

    const match = data.matches.find(m => String(m.match_id) === matchId);
    if(!match){ showError(`Match ID <strong>${matchId}</strong> not found. It may have ended.`); return; }

    // Show match info
    $id("match-title").textContent = match.title || "Live Match";
    $id("match-meta").textContent  = `${match.tournament || ""} · ${match.language || ""}`;

    // Global headers from JSON root
    const userAgent = data.headers?.["User-Agent"] || "ReactNativeVideo/9.3.0 (Linux;Android 13) AndroidXMedia3/1.6.1";
    const referer   = data.headers?.["Referer"]    || "https://fancode.com/";

    // Get master playlist text from auto_streams
    const masterText = match.auto_streams?.[0]?.auto;
    if(!masterText){ showError("No stream available for this match."); return; }

    const streams = parseMasterPlaylist(masterText, userAgent, referer);
    if(!streams.length){ showError("Could not parse stream qualities."); return; }

    buildQualityBar(streams);

    // Auto-start: prefer 480p, else middle quality
    const preferred = streams.find(s=>s.quality==="480p") || streams[Math.floor(streams.length/2)] || streams[0];
    const prefIdx   = streams.indexOf(preferred);
    document.querySelectorAll(".q-btn")[prefIdx]?.classList.add("active");
    document.querySelectorAll(".q-btn").forEach((b,i)=>b.classList.toggle("active", i===prefIdx));

    startHLS(preferred.url, preferred.userAgent, preferred.referer);

  } catch(err){
    showError("Failed to load: " + err.message);
  }
}

loadStream();
</script>
</body>
</html>
