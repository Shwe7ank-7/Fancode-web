<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Stream</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js"></script>

<style>

body{
margin:0;
background:#000;
color:#fff;
font-family:system-ui;
}

video{
width:100%;
background:#000;
}

.container{
padding:15px;
}

button{
display:block;
width:100%;
background:#e50914;
color:#fff;
border:0;
border-radius:8px;
padding:12px;
margin:8px 0;
font-weight:700;
}

#popup{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:flex;
align-items:center;
justify-content:center;
z-index:999;
}

.popup-box{
background:#FFD700;
color:#000;
padding:20px;
border-radius:12px;
width:300px;
text-align:center;
}

.popup-box button{
background:#000;
color:#FFD700;
}

</style>
</head>

<body>

<div id="popup">
<div class="popup-box">
<h3>Support Us</h3>
<p>Join Telegram for more live matches</p>

<button onclick="window.open('https://t.me/+3sgGQcDP6ExhYTU1','_blank')">
Join Telegram
</button>

<button onclick="popup.style.display='none'">
Already Joined
</button>

</div>
</div>

<video id="player" controls playsinline></video>

<div class="container" id="qualities"></div>

<script>

const JSON_URL="https://raw.githubusercontent.com/Jitendra-unatti/fancode/refs/heads/main/data/fancode.json";

const params=new URLSearchParams(location.search);
const matchId=params.get("id");

if(!matchId){
alert("Match ID missing");
}

async function loadStream(){

const res=await fetch(JSON_URL);
const data=await res.json();

const match=data.matches.find(m=>String(m.match_id)===matchId);

if(!match){
alert("Match not found");
return;
}

const playlist=match.auto_streams?.[0]?.auto;

const regex=/https.*?\.m3u8[^\n]*/g;

const urls=playlist.match(regex);

const container=document.getElementById("qualities");

urls.forEach(url=>{

const q=url.match(/(\d+)p/);

if(!q)return;

const btn=document.createElement("button");

btn.innerText="▶ "+q[1]+"p";

btn.onclick=()=>play(url);

container.appendChild(btn);

});

}

function play(url){

const video=document.getElementById("player");

if(Hls.isSupported()){

const hls=new Hls();

hls.loadSource(url);

hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,function(){

new Plyr(video);

video.play();

});

}

else{

video.src=url;
video.play();

}

}

loadStream();

</script>

</body>
</html>
